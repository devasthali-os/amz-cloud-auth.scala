# ---------------------------------------------------------------------------
# Which AWS federation pattern this app uses to vend credentials:
#   broker - Custom identity broker (e.g. Amazon-internal Devasthali):
#            corporate LDAP -> custom HTTP API -> STS creds.
#            See: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_enable-console-custom-url.html
#   sso    - AWS IAM Identity Center (formerly AWS SSO):
#            OIDC device flow -> SSO portal API -> STS creds.
# ---------------------------------------------------------------------------
vendor=sso

# ---------------------------------------------------------------------------
# Where the resulting AWS credentials are written. Both vendors share these.
# `auth.credentials.name` is the `[section]` header in the credentials file -
# any tool that reads ~/.aws/credentials with AWS_PROFILE=<name> will pick up
# the keys this app keeps refreshed.
# ---------------------------------------------------------------------------
auth.credentials.path=${user.home}/.aws/credentials
auth.credentials.name=dynamodb_access

# ---------------------------------------------------------------------------
# vendor=sso settings
# ---------------------------------------------------------------------------
# Name of the [profile X] block in ~/.aws/config the SSO settings live under.
# All SSO details (start url, region, account id, role name) are read from
# that profile - keep your AWS config as the single source of truth.
# Requires you to have run `aws sso login` for that profile beforehand;
# this app only refreshes the resulting STS credentials, it doesn't drive
# the browser-based OIDC device flow.
aws.sso.profile=dynamodb_access

# ---------------------------------------------------------------------------
# vendor=broker settings (e.g. Devasthali - Amazon-internal SAML proxy)
# ---------------------------------------------------------------------------
broker.endpoint=amztoken.devasthali.net
broker.resources.roles=/authentication/roleArns
broker.resources.tokens=/authentication/awsToken
auth.server.certs.store=/Library/Java/JavaVirtualMachines/jdk-17.0.8.jdk//Contents/Home/jre/lib/security/jssecacerts
